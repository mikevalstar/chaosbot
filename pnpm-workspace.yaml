packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  "@tanstack/react-query": ^5.95.2
  "@tanstack/react-router": ^1.168.7
  "@tanstack/router-plugin": ^1.167.8
  "@types/node": ^24
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  "@vitejs/plugin-react": ^6.0.1
  pino: ^10.3.1
  pino-pretty: ^13.1.3
  pino-roll: ^4.0.0
  react: ^19.2.4
  react-dom: ^19.2.4
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest

catalogMode: prefer
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
